<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pawn Shop - The Syndicate{% endblock %}</title>
    <!-- Tailwind CSS CDN for modern utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pawnBg: '#0e1117',
                        pawnCard: '#12161f',
                        pawnCardHover: '#1a2230',
                        gold: {
                            400: '#e5c158',
                            500: '#d4af37',
                            600: '#b89728',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0e1117;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        /* Ornate gold border frame */
        .pawn-frame {
            border: 2px solid #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15), inset 0 0 15px rgba(212, 175, 55, 0.05);
            background: linear-gradient(135deg, #12161f 0%, #0a0d14 100%);
        }
        .gold-text-glow {
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
        .tab-btn {
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            border-bottom: 3px solid #d4af37;
            color: #d4af37;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }
        .rarity-pill {
            cursor: pointer;
            transition: all 0.2s;
        }
        .rarity-pill:hover {
            transform: translateY(-1px);
            filter: brightness(1.2);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-pawnBg text-gray-100 flex flex-col">
    <!-- Top Ornate Header / Pawn Shop Frame -->
    <header class="w-full border-b border-yellow-600/40 bg-[#0c0f17] py-4 px-6 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            
            <!-- Left / Brand -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded border-2 border-yellow-500/80 flex items-center justify-center bg-yellow-500/10 text-yellow-400 font-bold text-xl shadow-[0_0_10px_rgba(212,175,55,0.3)]">
                    ⚖️
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-widest text-yellow-400 gold-text-glow uppercase font-serif">
                        PAWN SHOP
                    </h1>
                    <p class="text-xs text-yellow-600/80 tracking-wider">THE SYNDICATE MARKETPLACE</p>
                </div>
            </div>

            <!-- Top Center Navigation Tabs -->
            <nav class="flex items-center gap-2 md:gap-6 text-sm font-semibold tracking-wider">
                <a href="/" class="tab-btn active px-4 py-2 uppercase text-yellow-400 flex items-center gap-1.5">
                    <span>[ BUY ]</span>
                </a>
                <a href="/settings" class="tab-btn px-4 py-2 uppercase text-gray-400 hover:text-yellow-300 flex items-center gap-1.5">
                    <span>[ SELL ]</span>
                </a>
                <a href="/settings" class="tab-btn px-4 py-2 uppercase text-gray-400 hover:text-yellow-300 flex items-center gap-1.5">
                    <span>[ AUCTIONS ]</span>
                </a>
                <a href="/settings" class="tab-btn px-4 py-2 uppercase text-gray-400 hover:text-yellow-300 flex items-center gap-1.5">
                    <span>[ SWAP ]</span>
                </a>
            </nav>

            <!-- Right Actions / Settings -->
            <div class="flex items-center gap-3">
                <form action="/refresh" method="POST" class="inline">
                    <button type="submit" class="px-3 py-1.5 bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 border border-yellow-500/50 rounded text-xs font-bold transition flex items-center gap-1 shadow">
                        🔄 Refresh
                    </button>
                </form>
                <a href="/settings" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700 rounded text-xs font-semibold transition flex items-center gap-1">
                    ⚙️ Settings
                </a>
            </div>

        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-yellow-600/20 py-4 text-center text-xs text-yellow-600/60 bg-[#0a0d14]">
        <p>PAWN SHOP • The Syndicate Capo Intelligence & Marketplace Tracker</p>
    </footer>
</body>
</html>
